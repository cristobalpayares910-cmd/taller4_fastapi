{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Punto Limpio{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
  <header class="navbar">
    <a class="brand" href="{% url 'web:home' %}">
      <span class="brand-dot"></span> Punto Limpio
    </a>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <small>Taller 4 &middot; Django + FastAPI + MobileNetV2</small>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
