{% extends "base.html" %}

{% block title %}Crear cuenta — Punto Limpio{% endblock %}

{% block content %}
<section class="card auth-card">
  <h1>🌱 Crear cuenta</h1>
  <p class="muted">La contraseña se almacena como hash bcrypt en el backend.</p>

  <form method="post" novalidate>
    {% csrf_token %}
    <label for="full_name">Nombre completo</label>
    <input type="text" id="full_name" name="full_name"
           value="{{ full_name|default:'' }}" placeholder="Tu nombre" minlength="3" required>

    <label for="email">Correo electrónico</label>
    <input type="email" id="email" name="email" value="{{ email|default:'' }}"
           autocomplete="email" placeholder="tu@correo.com" required>

    <label for="password">Contraseña (mínimo 8 caracteres)</label>
    <input type="password" id="password" name="password" minlength="8"
           autocomplete="new-password" placeholder="••••••••" required>

    <label for="password2">Repetir contraseña</label>
    <input type="password" id="password2" name="password2" minlength="8"
           autocomplete="new-password" placeholder="••••••••" required>

    <button class="btn btn-primary btn-block" type="submit">🌿 Crear cuenta</button>
  </form>

  <div class="separator"></div>

  <p class="muted center">
    ¿Ya tienes cuenta? <a href="{% url 'web:login' %}">Ingresar</a>
  </p>
</section>
{% endblock %}
