{% extends "base.html" %}

{% block title %}Crear cuenta &middot; Punto Limpio{% endblock %}

{% block content %}
<section class="card auth-card">
  <h1>Crear cuenta</h1>
  <p class="muted">La contrasena se almacena como hash bcrypt en el backend.</p>

  <form method="post" novalidate>
    {% csrf_token %}
    <label for="full_name">Nombre completo</label>
    <input type="text" id="full_name" name="full_name"
           value="{{ full_name|default:'' }}" minlength="3" required>

    <label for="email">Correo electronico</label>
    <input type="email" id="email" name="email" value="{{ email|default:'' }}"
           autocomplete="email" required>

    <label for="password">Contrasena (minimo 8 caracteres)</label>
    <input type="password" id="password" name="password" minlength="8"
           autocomplete="new-password" required>

    <label for="password2">Repetir contrasena</label>
    <input type="password" id="password2" name="password2" minlength="8"
           autocomplete="new-password" required>

    <button class="btn btn-primary" type="submit">Crear cuenta</button>
  </form>

  <p class="muted center">
    Ya tienes cuenta? <a href="{% url 'web:login' %}">Ingresar</a>
  </p>
</section>
{% endblock %}
