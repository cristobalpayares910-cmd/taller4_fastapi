{% extends "base.html" %}

{% block title %}Ingresar &middot; Punto Limpio{% endblock %}

{% block content %}
<section class="card auth-card">
  <h1>Ingresar</h1>
  <p class="muted">Accede para clasificar residuos y revisar tu historial.</p>

  <form method="post" novalidate>
    {% csrf_token %}
    <label for="email">Correo electronico</label>
    <input type="email" id="email" name="email" value="{{ email|default:'' }}"
           autocomplete="email" required>

    <label for="password">Contrasena</label>
    <input type="password" id="password" name="password"
           autocomplete="current-password" required>

    <button class="btn btn-primary" type="submit">Ingresar</button>
  </form>

  <p class="muted center">
    No tienes cuenta? <a href="{% url 'web:register' %}">Registrate</a>
  </p>
</section>
{% endblock %}
